<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&amp;display=swap');
      .subtext {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.38em;
        fill: #14573D;
        text-anchor: middle;
      }
      .brandtext {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        font-size: 68px;
        font-weight: 800;
        letter-spacing: 0.02em;
        fill: #14573D;
        text-anchor: middle;
      }
      .brand-stroke {
        stroke: #14573D;
        stroke-width: 22px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .coin {
        fill: #E8A317;
      }
    </style>
  </defs>

  <!-- Fondo blanco liso -->
  <rect width="1000" height="1000" fill="#FFFFFF"/>

  <!-- SÍMBOLO CENTRAL: Centrado con amplio aire alrededor -->
  <g id="simbolo" transform="translate(0, 0)">
    <!-- Círculo exterior protector: trazo uniforme verde pino profundo (#14573D) -->
    <circle cx="500" cy="385" r="200" class="brand-stroke" stroke-width="20"/>

    <!-- Monograma L y U entrelazadas en trazo continuo -->
    <!-- Letra L: Asta vertical descendente + base horizontal estable -->
    <path d="M 400 270 
             L 400 440 
             A 42 42 0 0 0 442 482 
             L 590 482" 
          class="brand-stroke"/>

    <!-- Letra U: Brazos abiertos que acogen el ahorro común, fundiéndose en la base con la L -->
    <path d="M 445 335 
             L 445 425 
             A 55 55 0 0 0 555 425 
             L 555 335" 
          class="brand-stroke"/>

    <!-- Punto de contacto: Nodo de unión entre la base de la L y el cuenco de la U -->
    <circle cx="500" cy="480" r="11" fill="#14573D"/>

    <!-- Moneda dorada (#E8A317): Pequeña, acogida y protegida en los brazos de la U -->
    <circle cx="500" cy="325" r="28" class="coin"/>
  </g>

  <!-- TIPOGRAFÍA: Sans-serif geométrica limpia -->
  <!-- "Natillera" en pequeño con tracking generoso -->
  <text x="507" y="690" class="subtext">NATILLERA</text>

  <!-- "La Unión" en grande en negrita geométrica -->
  <text x="500" y="775" class="brandtext">La Unión</text>
</svg>